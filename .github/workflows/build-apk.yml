name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare web files and Capacitor
        run: |
          mkdir -p www
          cp index.html words.js www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Кто шпион" "com.beregdima.spygame" --web-dir www
          npx cap add android

      - name: Generate Android Icons directly
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$dir
          done
          convert icon.png -resize 48x48! PNG32:android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert icon.png -resize 72x72! PNG32:android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert icon.png -resize 96x96! PNG32:android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert icon.png -resize 144x144! PNG32:android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert icon.png -resize 192x192! PNG32:android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp android/app/src/main/res/$dir/ic_launcher.png android/app/src/main/res/$dir/ic_launcher_round.png
          done

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kto-Shpion-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
