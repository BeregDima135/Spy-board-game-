const AudioEngine = {
ctx: null,
init() {
if (!this.ctx) {
this.ctx = new (window.AudioContext || window.webkitAudioContext)();
}
},
play(type) {
if (!state.settings.sound) return;
try {
this.init();
const osc = this.ctx.createOscillator();
const gain = this.ctx.createGain();
osc.connect(gain);
gain.connect(this.ctx.destination);
const now = this.ctx.currentTime;
if (type === 'click') {
osc.type = 'sine';
osc.frequency.setValueAtTime(520, now);
osc.frequency.exponentialRampToValueAtTime(280, now + 0.06);
gain.gain.setValueAtTime(0.08, now);
gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
osc.start(now);
osc.stop(now + 0.06);
} else if (type === 'flip') {
osc.type = 'triangle';
osc.frequency.setValueAtTime(300, now);
osc.frequency.exponentialRampToValueAtTime(620, now + 0.12);
gain.gain.setValueAtTime(0.1, now);
gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
osc.start(now);
osc.stop(now + 0.12);
} else if (type === 'win') {
osc.type = 'triangle';
osc.frequency.setValueAtTime(440, now);
osc.frequency.setValueAtTime(554, now + 0.1);
osc.frequency.setValueAtTime(659, now + 0.2);
gain.gain.setValueAtTime(0.12, now);
gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
osc.start(now);
osc.stop(now + 0.4);
} else if (type === 'lose') {
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(240, now);
osc.frequency.linearRampToValueAtTime(140, now + 0.35);
gain.gain.setValueAtTime(0.1, now);
gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
osc.start(now);
osc.stop(now + 0.35);
}
} catch (e) {}
}
};

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function startRound() {
  AudioEngine.play('click');
  let pool = [];

  if (state.mode === 'locations') {
    pool = [...window.SPY_WORDS_DB.locations].sort((a, b) => a.localeCompare(b, 'ru'));
  } else if (state.category === 'mixed') {
    const counts = state.mixedCounts[state.difficulty];
    const cats = Object.keys(window.SPY_WORDS_DB.categories);
    cats.forEach(cKey => {
      const count = counts[cKey];
      if (count > 0) {
        const source = shuffleArray(window.SPY_WORDS_DB.categories[cKey][state.difficulty]);
        pool.push(...source.slice(0, count));
      }
    });
    if (pool.length === 0) {
      pool = [...window.SPY_WORDS_DB.categories.food[state.difficulty]];
    }
    pool = Array.from(new Set(pool)).sort((a, b) => a.localeCompare(b, 'ru'));
  } else {
    pool = [...window.SPY_WORDS_DB.categories[state.category][state.difficulty]].sort((a, b) => a.localeCompare(b, 'ru'));
  }

  state.round.pool = pool;
  state.round.secret = pool[Math.floor(Math.random() * pool.length)];
  state.round.spyIndex = Math.floor(Math.random() * state.playerCount);
  state.round.dealIndex = 0;
  state.round.cardOpened = false;
  state.round.usedHint = null;
  state.round.pointsAwarded = false;

  updateDealUI();
  goScreen('screen-deal');
}

    state.voting.voterIndex++;
    state.voting.selectedCandidate = null;
    updateVoteUI();
  } else {

function tallyVotes() {
  let maxVotes = 0;
  let leaders = [];
  for (const [pIdxStr, count] of Object.entries(state.voting.votes)) {
    const pIdx = parseInt(pIdxStr, 10);
    if (count > maxVotes) {
      maxVotes = count;
      leaders = [pIdx];
    } else if (count === maxVotes) {
      leaders.push(pIdx);
    }
  }

  if (leaders.length !== 1) {
    showResultModal('neutral', 'НИЧЬЯ!', 'Ничья! Никого не выгнали. Возвращаемся к обсуждению.', () => {
      goScreen('screen-discuss');
    });
    return;
  }

  const accusedIdx = leaders[0];
  const accusedName = state.players[accusedIdx].name;
  const spyIdx = state.round.spyIndex;
  const spyName = state.players[spyIdx].name;

  if (accusedIdx === spyIdx) {
    awardPointsToCivilians(1);
    AudioEngine.play('win');
    showResultModal(
      'win',
      'ШПИОН РАСКРЫТ!',
      `Голосованием выгнали: ${accusedName}. Это был шпион! Мирные получают +1 балл. Шпион сразу проигрывает без права угадать секрет.`,
      () => openFinalRevealOnly()
    );
  } else {
    awardPointsToSpy(6);
    AudioEngine.play('lose');
    showResultModal(
      'lose',
      'ПОБЕДА ШПИОНА!',
      `Голосованием выгнали: ${accusedName}. Ошибка! Настоящим шпионом был ${spyName}. Автоматическая победа шпиона (+6 баллов)!`,
      () => openFinalRevealOnly()
    );
  }
}

function jumpToLetter(char) {
  const letter = char.trim().toLowerCase();
  if (!letter) return;
  const listEl = document.getElementById('guess-words-list');
  const cards = Array.from(listEl.querySelectorAll('.guess-word-card'));
  const targetCard = cards.find(c => c.dataset.word.startsWith(letter));
  if (targetCard) {
    targetCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    alert(`Вариантов на букву «${char.toUpperCase()}» в этом раунде нет.`);
  }
}

function useSpyHint(type) {
  if (state.round.usedHint) return;
  AudioEngine.play('click');
  state.round.usedHint = type;

  ['hint-half', 'hint-5', 'hint-3'].forEach(id => {
    const btn = document.getElementById(id);
    if (id === `hint-${type}`) {
      btn.classList.add('used');
    } else {
      btn.disabled = true;
    }
  });

  const secret = state.round.secret;
  const others = shuffleArray(state.round.pool.filter(w => w !== secret));
  let count = 3;
  if (type === 'half') count = Math.max(2, Math.ceil(state.round.pool.length / 2));
  if (type === '5') count = Math.min(5, state.round.pool.length);
  if (type === '3') count = Math.min(3, state.round.pool.length);

  const subset = shuffleArray([secret, ...others.slice(0, count - 1)]).sort((a, b) => a.localeCompare(b, 'ru'));
  const chipsArea = document.getElementById('hint-chips-area');
  chipsArea.innerHTML = subset.map(w => `<button class="hint-chip" onclick="evaluateSpyGuess('${w.replace(/'/g, "\\'")}')">${w}</button>`).join('');
}

function evaluateSpyGuess(chosenWord) {
  const isCorrect = chosenWord === state.round.secret;
  const hint = state.round.usedHint;
  const isLoc = state.mode === 'locations';
  const typeWord = isLoc ? 'локацию' : 'слово';
  const hintLabel = hint === 'half' ? 'Подсказка «Половина»' : hint === '5' ? 'Подсказка «5 слов»' : hint === '3' ? 'Подсказка «3 слова»' : 'Без подсказки';

  if (isCorrect) {
    const spyPts = hint === null ? 6 : hint === 'half' ? 3 : hint === '5' ? 1 : 0;
    awardPointsToSpy(spyPts);
    AudioEngine.play('win');
    showResultModal(
      'win',
      'ПОБЕДА ШПИОНА!',
      `Шпион угадал ${typeWord}. ${hintLabel}: шпион угадал и получает +${spyPts} баллов!`,
      () => openFinalRevealOnly()
    );
  } else {
    const civPts = hint === null ? 1 : hint === 'half' ? 2 : hint === '5' ? 4 : 6;
    awardPointsToCivilians(civPts);
    AudioEngine.play('lose');
    showResultModal(
      'lose',
      'ПОРАЖЕНИЕ ШПИОНА!',
      `Шпион не угадал. Правильный ответ: ${state.round.secret.toUpperCase()}. ${hintLabel}: шпион не угадал. Мирные получают +${civPts} балла!`,
      () => openFinalRevealOnly()
    );
  }
}

function openFinalRevealOnly() {
  const isLoc = state.mode === 'locations';
  const spyName = state.players[state.round.spyIndex].name;
  document.getElementById('reveal-spy-name').textContent = spyName;
  document.getElementById('spy-guess-section').style.display = 'none';
  document.getElementById('final-secret-card').style.display = 'flex';
  document.getElementById('final-secret-label').textContent = isLoc ? 'СЕКРЕТНАЯ ЛОКАЦИЯ' : 'ЗАГАДАННОЕ СЛОВО';
  document.getElementById('final-secret-value').textContent = state.round.secret;
  goScreen('screen-reveal');
  checkTargetScoreWinner();
}

function awardPointsToSpy(pts) {
  if (state.round.pointsAwarded) return;
  state.round.pointsAwarded = true;
  state.players[state.round.spyIndex].score += pts;
}

function awardPointsToCivilians(pts) {
  if (state.round.pointsAwarded) return;
  state.round.pointsAwarded = true;
  for (let i = 0; i < state.playerCount; i++) {
    if (i !== state.round.spyIndex) {
      state.players[i].score += pts;
    }
  }
}

function checkTargetScoreWinner() {
  const target = state.settings.targetScore;
  if (target <= 0) return;
  const winners = state.players.slice(0, state.playerCount).filter(p => p.score >= target);
  if (winners.length > 0) {
    winners.sort((a, b) => b.score - a.score);
    setTimeout(() => {
      alert(`🏆 ИГРА ОКОНЧЕНА!\n\nПобедитель матча: ${winners[0].name} (${winners[0].score} баллов из ${target})!`);
    }, 300);
  }
}

function openScoreModal() {
  const target = state.settings.targetScore;
  document.getElementById('score-target-subtitle').textContent = target > 0 ? `Цель игры: ${target} баллов` : 'Цель игры: Без лимита';
  const list = document.getElementById('score-list-container');
  const activePlayers = state.players.slice(0, state.playerCount);
  list.innerHTML = activePlayers.map(p => `
    <div class="score-item">
      <span>${p.name}</span>
      <span>${p.score} Б.</span>
    </div>
  `).join('');
  openModal('modal-score');
}

function showResultModal(type, title, text, onClose) {
  const box = document.getElementById('result-modal-box');
  box.className = `modal-box result-card ${type}`;
  document.getElementById('result-modal-title').textContent = title;
  document.getElementById('result-modal-text').textContent = text;
  state.round.afterResultAction = onClose;
  document.getElementById('modal-result').classList.add('active');
}

function closeResultModal() {
  AudioEngine.play('click');
  document.getElementById('modal-result').classList.remove('active');
  if (typeof state.round.afterResultAction === 'function') {
    const fn = state.round.afterResultAction;
    state.round.afterResultAction = null;
    fn();
  }
}
</script>
